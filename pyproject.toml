[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzpeak-validator"
version = "0.9.1"
description = "Language-independent-by-design validator for the HUPO-PSI mzPeak mass-spectrometry format."
readme = "README.md"
requires-python = ">=3.9"  # 3.14 verified; floor kept at 3.9 for breadth
authors = [{name = "Oliver Kohlbacher", email = "okohlbacher@googlemail.com"}]
license = {text = "MIT"}
keywords = ["mzPeak", "mass-spectrometry", "HUPO-PSI", "proteomics", "imaging-MS", "validation", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = ["pyarrow>=17", "numpy", "jsonschema>=3"]

[project.scripts]
mzpeak-validate = "mzpeak_validator.core:main"

[project.urls]
Homepage = "https://github.com/okohlbacher/mzPeakValidator"
Repository = "https://github.com/okohlbacher/mzPeakValidator"

[tool.setuptools]
packages = ["mzpeak_validator"]

# Ship the versioned profile bundle (CV OBO snapshots, JSON schemas, declarative
# rules, and bundled PSI CvMapping files) as package data so it resolves after
# install via Path(__file__).parent / "profiles". Every subdirectory of a profile
# must be listed — a missing glob silently ships a validator that skips those rules.
[tool.setuptools.package-data]
mzpeak_validator = [
  "profiles/*/profile.json",
  "profiles/*/cv/*",                 # pinned OBO snapshots (*.obo, *.obo.gz)
  "profiles/*/cv_mapping/*.json",    # bundled PSI CvMapping rule sets (semantic validation)
  "profiles/*/rules/*.json",         # declarative rule instances
  "profiles/*/schema/*.json",        # top-level index schema
  "profiles/*/schema/tables/*.json", # per-table column specs
  "profiles/*/schema/json/*.json",   # draft-07 schemas for json_schema rules
]
