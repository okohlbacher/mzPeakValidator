[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzpeak-validator"
version = "0.1.0"
description = "Language-independent-by-design validator for the HUPO-PSI mzPeak mass-spectrometry format."
readme = "README.md"
requires-python = ">=3.7"
authors = [{name = "Oliver Kohlbacher", email = "okohlbacher@googlemail.com"}]
license = {text = "MIT"}
keywords = ["mzPeak", "mass-spectrometry", "HUPO-PSI", "proteomics", "imaging-MS", "validation", "parquet"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Programming Language :: Python :: 3",
]
dependencies = ["pyarrow>=12", "numpy", "jsonschema>=3"]

[project.scripts]
mzpeak-validate = "mzpeak_validator.core:main"

[project.urls]
Homepage = "https://github.com/okohlbacher/mzPeakValidator"
Repository = "https://github.com/okohlbacher/mzPeakValidator"

[tool.setuptools]
packages = ["mzpeak_validator"]

# Ship the versioned profile bundle (CV OBO snapshots, JSON schemas, declarative rules)
# as package data so it resolves after install via Path(__file__).parent / "profiles".
[tool.setuptools.package-data]
mzpeak_validator = [
  "profiles/*/profile.json",
  "profiles/*/cv/*",
  "profiles/*/schema/*.json",
  "profiles/*/schema/tables/*.json",
  "profiles/*/rules/*.json",
]
