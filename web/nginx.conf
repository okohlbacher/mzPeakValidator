# mzPeak Validator — nginx server block
# Deploy as: /etc/nginx/sites-available/validator.mzpeak.org
# Enable:    ln -s /etc/nginx/sites-available/validator.mzpeak.org /etc/nginx/sites-enabled/
# TLS cert:  certbot --nginx -d validator.mzpeak.org
#
# The FastAPI service runs at 127.0.0.1:8000 (started by systemd or Docker).

server {
    listen 80;
    server_name validator.mzpeak.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name validator.mzpeak.org;

    ssl_certificate     /etc/letsencrypt/live/validator.mzpeak.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/validator.mzpeak.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Reject uploads > 1 GB at the HTTP layer before Python sees them
    client_max_body_size 5g;
    client_body_timeout  300s;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        # Allow long-running validations (large files may take minutes)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
